services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      - SHOP_BASE_URL=http://192.168.1.41:8000
      - PYTHONUNBUFFERED=1
