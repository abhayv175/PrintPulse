services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      - SHOP_BASE_URL=https://jh0yc.aiccloud.online
      - API_BASE_URL=https://jh0yc.aiccloud.online
      - PYTHONUNBUFFERED=1
